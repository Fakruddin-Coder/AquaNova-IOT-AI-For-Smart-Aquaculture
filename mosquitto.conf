# ============================================================
# Mosquitto MQTT Broker Configuration — AquaNova
# ============================================================

# --------------------------------------------------
# Listener 1: Standard MQTT TCP — for ESP32 firmware
# Listening on 0.0.0.0:1884 allows any device on your Wi-Fi
# (like your ESP32) to connect seamlessly.
# --------------------------------------------------
listener 1884 0.0.0.0
protocol mqtt
allow_anonymous true

# --------------------------------------------------
# Listener 2: MQTT over WebSocket — for Browser Dashboard
# --------------------------------------------------
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

# --------------------------------------------------
# Bridge to local Windows Mosquitto service (1883)
# Shares all topics (#) between ports 1883, 1884, and 9001
# --------------------------------------------------
connection local_service_bridge
address 127.0.0.1:1883
topic # both 0

# --------------------------------------------------
# General Settings
# --------------------------------------------------
allow_anonymous true
log_type all
log_timestamp true
